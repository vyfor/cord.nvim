name: 🐛 Bug report
description: Report a problem or unexpected behaviour
labels: [bug]
body:
  - type: textarea
    attributes:
      label: "Checklist"
      value: |
        - [ ] My problem isn't listed in the [Troubleshooting](https://github.com/vyfor/cord.nvim/wiki/Troubleshooting) section of the wiki
        - [ ] I have looked through [existing issues](https://github.com/vyfor/cord.nvim/issues)
        - [ ] I am aware of the recent [announcements](https://github.com/vyfor/cord.nvim/discussions/categories/announcements)
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Description"
      description: "Description of the problem you are facing. You may include any relevant logs, screenshots, etc. If you're willing to provide logs, please attach them as a file. [How to get logs?](https://github.com/vyfor/cord.nvim/wiki/FAQ#logging-for-debugging)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Debug information"
      description: "Output of `:Cord debug copy`"
      render: markdown
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Minimal configuration"
      description: "Minimal configuration to reproduce the issue"
      render: markdown
      value: |
        <!-- if possible, include steps to reproduce using this minimal config -->

        ```lua
        vim.env.LAZY_STDPATH = '.repro'
        load(vim.fn.system 'curl -s https://raw.githubusercontent.com/folke/lazy.nvim/main/bootstrap.lua')()

        require('lazy.minit').repro {
          spec = {
            {
              'vyfor/cord.nvim',
            },
          },
        }
        ```
    validations:
      required: true
